<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Keluarga Kecil</title>

    <meta
      name="description"
      content="Aplikasi keluarga kecil Nidia dan Rizki"
    />

    <!-- Ikon pada tab browser -->
    <link
      rel="icon"
      type="image/png"
      href="/apple-touch-icon.png?v=4"
    />

    <!-- Ikon alternatif untuk browser -->
    <link
      rel="shortcut icon"
      type="image/png"
      href="/apple-touch-icon.png?v=4"
    />

    <!-- Ikon saat website ditambahkan ke Home Screen iPhone -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=4"
    />

    <!-- Nama aplikasi pada iPhone -->
    <meta
      name="apple-mobile-web-app-title"
      content="Nidia n Rizki"
    />

    <!-- Menjalankan website seperti aplikasi di iPhone -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <!-- Dukungan mode aplikasi pada browser lain -->
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <!-- Tampilan status bar iPhone -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <!-- Nama aplikasi umum -->
    <meta
      name="application-name"
      content="Nidia n Rizki"
    />

    <!-- Warna antarmuka browser -->
    <meta
      name="theme-color"
      content="#ffffff"
    />

    <!-- Font -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <noscript>
      Aplikasi ini membutuhkan JavaScript agar dapat berjalan.
    </noscript>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
